<title>Nosso Casamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: menu lateral no desktop, barra inferior no celular; cada seção é uma lista editável por modal. */
:root{
  --bg:#F5F4F6;--surface:#FFFFFF;--surface2:#EFEDF1;--line:#E1DDE5;
  --fg:#1E1B26;--muted:#6B6577;
  --accent:#8E2B5C;--accent-ink:#FFFFFF;--accent-soft:#F3E3EC;
  --ok:#2E7D5B;--ok-soft:#DDF0E7;--warn:#9A6A12;--warn-soft:#F6EAD0;--bad:#B3372F;--bad-soft:#F7DEDA;
  --f-display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151219;--surface:#1E1A24;--surface2:#272230;--line:#342E3F;--fg:#F0EDF4;--muted:#A39CB0;
  --accent:#E07AAA;--accent-ink:#1A0F16;--accent-soft:#3A2231;
  --ok:#5FC896;--ok-soft:#1D3329;--warn:#E3B15A;--warn-soft:#3A2F1A;--bad:#F08A80;--bad-soft:#3E2321;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151219;--surface:#1E1A24;--surface2:#272230;--line:#342E3F;--fg:#F0EDF4;--muted:#A39CB0;
  --accent:#E07AAA;--accent-ink:#1A0F16;--accent-soft:#3A2231;
  --ok:#5FC896;--ok-soft:#1D3329;--warn:#E3B15A;--warn-soft:#3A2F1A;--bad:#F08A80;--bad-soft:#3E2321;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{padding:4px 10px 18px}
.brand b{font:700 21px/1.1 var(--f-display);letter-spacing:-.01em;display:block}
.brand span{font-size:12.5px;color:var(--muted)}
.grp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;width:100%;text-align:left;color:var(--fg)}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .bd{margin-left:auto;font-size:12px;font-weight:600;background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.main{padding:28px clamp(16px,3.2vw,44px) 60px;max-width:1120px;width:100%;min-width:0}
.vh{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.vh h1{font:700 clamp(26px,4vw,34px)/1.1 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);max-width:60ch}
.vact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;border:1px solid transparent}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font:600 16px/1.2 var(--f-display);margin:0 0 12px;letter-spacing:-.005em}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--muted)}
.small{font-size:13px}
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar.thin{height:6px}
.c-ok{background:var(--ok)}.c-warn{background:#D9A441}.c-acc{background:var(--accent)}.c-mut{background:var(--line)}.c-bad{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend b{color:var(--fg);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
button.chip:hover{filter:brightness(.96)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:end;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:clamp(20px,3vw,32px);margin-bottom:16px}
.hero .names{font:700 clamp(28px,4.4vw,44px)/1.05 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.hero p{margin:8px 0 0;opacity:.85}
.count{text-align:right}
.count b{font:700 clamp(54px,9vw,92px)/.9 var(--f-display);letter-spacing:-.04em;display:block}
.count span{opacity:.85}
.miles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.mile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mile small{color:var(--muted);display:block}
.mile b{font-weight:600}
.mile.past{opacity:.6}
/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface2)}
.item .main2{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.item .r{display:flex;gap:8px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}
.item.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;background:var(--surface)}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.phase{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface2);width:100%;text-align:left;font-weight:600;border-bottom:1px solid var(--line)}
.phase .when{font-weight:400;color:var(--muted);font-size:13px}
.phase .cnt{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
.phase.now{background:var(--accent-soft);color:var(--accent)}
.phase.now .when,.phase.now .cnt{color:var(--accent)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);flex:none}
.av.a0{background:var(--accent-soft);color:var(--accent)}
.av.a1{background:var(--warn-soft);color:var(--warn)}
.av.a2{background:var(--ok-soft);color:var(--ok)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
.toolbar .field{width:auto;flex:0 1 190px}
.toolbar .search{flex:1 1 220px;max-width:340px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum small{color:var(--muted);display:block;font-size:12.5px}
.sum b{font:600 20px/1.3 var(--f-display);font-variant-numeric:tabular-nums}
.brow{display:grid;grid-template-columns:minmax(150px,1.2fr) repeat(4,minmax(86px,.8fr));gap:6px 14px;align-items:center}
.brow .lbl small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.03em}
.brow .n{font-variant-numeric:tabular-nums;font-weight:500}
.brow .full{grid-column:1/-1}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.scard:hover{border-color:var(--accent)}
.scard .cat{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scard .co{font:600 17px/1.2 var(--f-display);overflow-wrap:anywhere}
.scard .co.empty{color:var(--muted);font-weight:500;font-family:var(--f-body);font-size:15px}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,10,20,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.dlg{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg h3{font:700 20px/1.2 var(--f-display);margin:0 0 16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.form label.cb{flex-direction:row;align-items:center;gap:9px;color:var(--fg);font-size:15px}
.form label.cb input{width:19px;height:19px;accent-color:var(--accent)}
.form .hint{font-size:12px;font-weight:400}
.form textarea{min-height:76px;resize:vertical}
.fa{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.fa .sp{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;max-width:calc(100% - 32px)}
.tabbar{display:none}
.center{max-width:520px;margin:12vh auto;text-align:center;padding:0 16px}
.center h1{font:700 32px/1.1 var(--f-display);margin:0 0 10px}
.prog{height:6px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:#fff}
.toast.win{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.3)}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes rise{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast{animation:rise .25s ease-out}
.chk.pop svg{animation:pop .4s ease-out}
.qa{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qa .field{flex:1 1 220px;width:auto}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;align-items:center;margin-bottom:14px}
.lvl .big{font:700 46px/1 var(--f-display);color:var(--accent);letter-spacing:-.03em}
.lvl .big small{display:block;font:600 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.lvl h2{margin:0 0 8px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.badge{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);min-width:0}
.badge b{display:block;font-size:13.5px;line-height:1.2;color:var(--fg)}
.badge small{display:block;font-size:11.5px;color:var(--muted);line-height:1.25}
.badge .ic{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.badge.lock{background:var(--surface2);color:var(--muted)}
.badge.lock .ic{background:var(--line);color:var(--muted)}
.badge.lock b{color:var(--muted)}
textarea.field{font-family:inherit;resize:vertical}
.pv{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:13.5px}
.mbars{display:flex;gap:6px;align-items:flex-end;height:190px;overflow-x:auto;padding-top:6px}
.mb{flex:1 0 46px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.mb i{display:block;width:70%;max-width:44px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:0}
.mb .v{font-size:11.5px;font-weight:600;height:15px}
.mb .l{font-size:11.5px;color:var(--muted);height:15px}
.mb.ev .l{color:var(--accent);font-weight:600}
.gantt{overflow-x:auto;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
.gantt table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.gantt th,.gantt td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.gantt .sticky{position:sticky;left:0;background:var(--surface);text-align:left;min-width:190px;max-width:230px;white-space:normal;z-index:1;border-right:1px solid var(--line);padding-left:14px}
.gantt th.sticky b{font-weight:600;display:block}
.gantt th.sticky small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;line-height:1.3}
.gantt thead th{font-weight:600;font-size:12px;color:var(--muted);background:var(--surface)}
.gantt .mh{min-width:62px}
.gantt .mh small{display:block;font-weight:500;font-size:10.5px;color:var(--accent)}
.gantt{--gc0:var(--accent);--gc1:#5B7BD5;--gc2:var(--ok);--gc3:#C98A1B;--gc4:#8A5BD5}
.gantt td.gap{padding:0;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(100%/var(--cols,1)) 100%;text-align:left}
.gantt td.gbar{padding:7px 0}
.gb{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 12px;border-radius:9px;color:#fff;font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;font-variant-numeric:tabular-nums;margin:0 2px}
.gb b{font-weight:700;opacity:.92}
.gb.c0{background:var(--gc0);color:var(--accent-ink)}.gb.c1{background:var(--gc1)}.gb.c2{background:var(--gc2)}.gb.c3{background:var(--gc3)}.gb.c4{background:var(--gc4)}
.gantt td.today,.gantt th.today{box-shadow:inset 0 -2px 0 var(--accent)}
.gantt{user-select:none;-webkit-user-select:none}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 18px 10px;flex-wrap:wrap}
.gh h2{margin:0}
.gcard.gfull{position:fixed;inset:0;z-index:70;border-radius:0;margin:0!important;padding:calc(14px + env(safe-area-inset-top,0px)) 0 0!important;display:flex;flex-direction:column;overflow:hidden}
.gcard.gfull .gantt{flex:1;overflow:auto;min-height:0}
.gcard.gfull .gantt table{min-width:100%!important}
.gcard.gfull .gantt td.gbar{padding:11px 0}
.gcard.gfull .gb{padding:11px 14px;font-size:13.5px}
.ov{z-index:85!important}.toast{z-index:95!important}
.gantt th.mh,.gantt tfoot td[data-mo]{cursor:pointer}
.gantt th.mh:hover,.gantt tfoot td[data-mo]:hover{background:var(--accent-soft)!important;color:var(--accent)}
.gantt td.gap,.gantt td.gbar{cursor:pointer}
.pt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pt small{display:block;color:var(--muted);font-size:12.5px}
.pt b{font:700 clamp(18px,3.4vw,28px)/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.gantt tr.sec th{background:var(--surface2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:6px;padding-bottom:6px}
.gantt td.osum{font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.gantt td.pos{color:var(--ok)}.gantt td.neg{color:var(--bad)}
.mrow,.irow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mrow .main2{flex:1;min-width:0}.mrow b{display:block;font-weight:600}.mrow small{font-size:12px}
.mrow .mp{width:140px;flex:none;text-align:right}
.irow,.mrow{flex-wrap:wrap}
.mo{flex:1 1 100%;display:flex;gap:8px}.mo .mq{flex:0 1 150px;width:auto}.mo .mf{flex:1 1 150px;width:auto}
.ap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.ap .field{flex:1 1 130px;width:auto}
.irow .if{flex:1 1 130px;width:auto}.irow .iq{flex:0 1 110px;width:auto}.irow .iv{flex:0 1 120px;width:auto;text-align:right}
.cb2{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex:1 1 120px}
.cb2 input{accent-color:var(--accent)}
.gb{position:relative;cursor:grab;touch-action:none}
.gb.drag,.gb:active{cursor:grabbing}
.gb span,.gb b{pointer-events:none;white-space:nowrap}
.gb .hl{position:absolute;top:0;bottom:0;left:0;width:12px;cursor:ew-resize;border-radius:9px 0 0 9px}
.gb .hl.r{left:auto;right:0;border-radius:0 9px 9px 0}
.gb .hl::after{content:"";position:absolute;top:30%;bottom:30%;left:4px;width:3px;border-radius:2px;background:rgba(255,255,255,.55)}
.gb .hl.r::after{left:auto;right:4px}
.gb:hover .hl::after{background:rgba(255,255,255,.95)}
.gantt tbody tr{cursor:pointer}
.gantt tbody tr:hover .sticky,.gantt tbody tr:hover td:not(.on){background:var(--surface2)}
.gantt tfoot td,.gantt tfoot th{font-weight:600;font-variant-numeric:tabular-nums;border-bottom:0;background:var(--surface2)}
@media (max-width:860px){
  .shell{display:block}
  .side{display:none}
  .main{padding-bottom:110px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:40}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:5px 0;border-radius:10px;position:relative}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--accent);font-weight:600}
  .tabbar .bd{position:absolute;top:0;right:22%;background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;padding:0 5px;min-width:17px;text-align:center}
  .hero{grid-template-columns:1fr}.count{text-align:left}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .brow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brow .lbl{grid-column:1/-1}
}
@media (max-width:520px){
  .miles{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .item{padding:12px}
  .item .r{flex:none}
  .ov{align-items:flex-end;padding:0}
  .dlg{border-radius:18px 18px 0 0;width:100%;max-height:92%}
}

function confetti(x,y,n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  n=n||60;const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90';
  const W=cv.width=innerWidth,H=cv.height=innerHeight;document.body.appendChild(cv);const g=cv.getContext('2d');
  const cols=['#8E2B5C','#E07AAA','#D9A441','#2E7D5B','#5B7BD5','#F2C14E'];
  const P=Array.from({length:n},()=>({x,y,vx:(Math.random()-.5)*13,vy:-Math.random()*13-3,r:Math.random()*5+3,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let t=0;(function f(){g.clearRect(0,0,W,H);t++;P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.globalAlpha=Math.max(0,1-t/85);g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()});if(t<85)requestAnimationFrame(f);else cv.remove()})();
}
const burst=el=>{const r=el.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,45)};

function levelInfo(T){

  return{l,d,n,name:LV[l],next:LV[l+1],need:Math.max(0,nx-d),pct:l>=6?100:pct2(d-base,nx-base)};
}

function checkBadges(){
  if(!S.cfg||COLS.some(c=>!S.loaded[c]))return;
  const c=ctx(),un=BADGES.filter(b=>b[3](c)).map(b=>b[0]),lv=levelInfo(c.T).l;
  let seen=null,last=null;try{seen=JSON.parse(localStorage.getItem('nc_seen')||'null');last=localStorage.getItem('nc_lv')}catch(_){}
  try{localStorage.setItem('nc_seen',JSON.stringify(un));localStorage.setItem('nc_lv',String(lv))}catch(_){}
  if(seen==null)return;
  const fresh=BADGES.filter(b=>un.includes(b[0])&&!seen.includes(b[0]));
  if(fresh.length){toast('Conquista desbloqueada: '+fresh.map(b=>b[1]).join(', '),1);bigBurst()}
  if(last!=null&&lv>+last)setTimeout(()=>{toast('Nível '+(lv+1)+': '+LV[lv]+'!',1);bigBurst()},fresh.length?2600:0);
}
async function guard(fn){
  try{return await fn()}catch(err){
    const c=err&&err.code;
    toast(c==='invalid_argument'?'Sem permissão para editar. Peça acesso de editor no menu Compartilhar.':c==='quota_exceeded'?'Limite de dados atingido.':'Não foi possível salvar. Tente de novo.');
    return null;
  }
}

/* ---------- cálculos ---------- */
function dueOf(t){
  if(t.prazo)return t.prazo;
  const w=S.cfg&&S.cfg.dataCasamento;if(!w)return null;
  const p=PH.find(x=>x[0]===t.quando);if(!p)return null;
  return addMD(w,p[1],p[2]);
}
const isDone=t=>t.status==='Concluído';
function taskInfo(){
  const today=todayISO();
  return rows('tasks').map(t=>{const due=dueOf(t);return{...t,due,done:isDone(t),late:!isDone(t)&&!!due&&due<today}});
}
function budgetCalc(){
  const R=rows('budget');let prev=0,contr=0,pago=0,est=0,commit=0;
  R.forEach(r=>{const p=num(r.previsto),c=num(r.contratado),g=num(r.pago);prev+=p;contr+=c;pago+=g;
    if(c>0){commit+=c}else{commit+=p;est+=p}});
  const total=num(S.cfg&&S.cfg.orcamento);
  return{prev,contr,pago,est,commit,total,falta:Math.max(0,contr-pago),livre:total-commit};
}
const guestCalc=()=>{const G=rows('guests');const sum=f=>G.filter(f).reduce((a,g)=>a+(num(g.pessoas)||1),0);
  return{total:sum(()=>true),conf:sum(g=>g.rsvp==='Confirmado'),rec:sum(g=>g.rsvp==='Recusou'),pend:sum(g=>g.rsvp!=='Confirmado'&&g.rsvp!=='Recusou'),conv:sum(g=>g.convite),n:G.length}};

function vInicio(){
  const c=S.cfg,today=todayISO(),T=taskInfo(),B=budgetCalc(),G=guestCalc();
  const dd=c.dataCasamento?diffDays(today,c.dataCasamento):null;

  const foco=focus.length?focus:T.filter(t=>!t.done).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);

  const thanks=rows('received').filter(r=>!r.agradeceu).length;

  ${(()=>{const L=levelInfo(T);return`<div class="card lvl"><div class="big"><small>Nível</small>${L.l+1}</div><div><h2>${e(L.name)}</h2>${bar([[L.pct,'c-acc']])}<p class="muted small" style="margin:8px 0 0">${L.l>=6?'Tudo concluído. Parabéns!':`Faltam <b>${L.need}</b> ${plural(L.need,'tarefa','tarefas')} para chegar em “${e(L.next)}”.`}</p></div></div>`})()}
  <div class="grid g2">
   <div class="card"><h2>O que fazer agora</h2>

    <p class="small muted" style="margin:10px 0 0">${doneN} de ${T.length} tarefas concluídas${lt?` · <b style="color:var(--bad)">${lt} ${plural(lt,'atrasada','atrasadas')}</b>`:''}. <a href="#tarefas" data-act="nav" data-v="tarefas" style="color:var(--accent)">Ver todas</a></p>
    <div style="margin-top:8px">${bar([[pct(doneN,T.length),'c-ok']])}</div></div>
   <div class="card"><h2>Orçamento</h2>
    ${B.total?bar([[pct(B.pago,B.total),'c-ok'],[pct(B.falta,B.total),'c-warn'],[pct(B.est,B.total),'c-acc']]):'<p class="muted">Defina o orçamento total em Ajustes.</p>'}
    <div class="legend"><span><i class="dot c-ok"></i>Pago <b class="num">${money(B.pago)}</b></span><span><i class="dot c-warn"></i>A pagar <b class="num">${money(B.falta)}</b></span><span><i class="dot c-acc"></i>Estimado <b class="num">${money(B.est)}</b></span></div>
    <p style="margin:14px 0 0;font-size:18px;font-family:var(--f-display);font-weight:600" class="num">${B.livre>=0?`${money(B.livre)} <span class="muted small" style="font-family:var(--f-body);font-weight:400">livres de ${money(B.total)}</span>`:`<span style="color:var(--bad)">${money(-B.livre)} acima</span> <span class="muted small" style="font-family:var(--f-body);font-weight:400">do orçamento de ${money(B.total)}</span>`}</p>

  ${(()=>{const cx=ctx(),n=BADGES.filter(b=>b[3](cx)).length;return`<div class="card" style="margin-top:14px"><h2>Conquistas <span class="muted small" style="font-family:var(--f-body);font-weight:400">${n} de ${BADGES.length}</span></h2><div class="badges">${BADGES.map(b=>{const ok=b[3](cx);return`<div class="badge ${ok?'':'lock'}"><span class="ic">${ico(ok?'check':'ring')}</span><span style="min-width:0"><b>${b[1]}</b><small>${b[2]}</small></span></div>`}).join('')}</div></div>`})()}`;

  const pr=PH.find(p=>p[0]===t.quando);
  return`<div class="item ${t.done?'done':''}" data-act="edit" data-m="tasks" data-id="${t.id}">
   <button class="chk ${t.done?'on':''} ${S.justDone===t.id?'pop':''}" data-act="toggleTask" data-id="${t.id}" aria-label="${t.done?'Marcar como pendente':'Marcar como concluída'}">${ico('check')}</button>
   <div class="main2"><div class="t">${e(t.tarefa)}</div><div class="m">
    ${t.status==='Em andamento'?'<span class="chip warn">Em andamento</span>':''}
    ${t.due?`<span class="chip ${t.late?'bad':''}">${t.late?'Atrasada · ':'Até '}${fmtD(t.due)}</span>`:''}
    ${compact?'':avatar(t.responsavel)}${t.obs&&!compact?`<span class="muted small">${e(t.obs)}</span>`:''}</div></div></div>`;

function vTarefas(){
  const T=taskInfo(),today=todayISO(),F=S.f;
  const flt=T.filter(t=>(F.tf==='todas'||(F.tf==='fazer'&&!t.done)||(F.tf==='atrasadas'&&t.late)||(F.tf==='feitas'&&t.done))&&(!F.tr||t.responsavel===F.tr));
  const done=T.filter(t=>t.done).length,late=T.filter(t=>t.late).length;
  let body='';
  PHN.forEach(ph=>{
    const all=T.filter(t=>t.quando===ph),shown=flt.filter(t=>t.quando===ph);
    if(!shown.length)return;
    const p=PH.find(x=>x[0]===ph),w=S.cfg.dataCasamento,end=w?addMD(w,p[1],p[2]):null;
    const now=end&&all.some(t=>!t.done)&&end>=today&&!PH.some((q,i)=>i<PHN.indexOf(ph)&&T.some(t=>t.quando===q[0]&&!t.done)&&addMD(w,q[1],q[2])>=today);
    const closed=S.fold[ph];
    body+=`<button class="phase ${now?'now':''}" data-act="fold" data-k="${e(ph)}" aria-expanded="${!closed}">${e(ph==='Dia'?'No dia':ph==='Pós'?'Depois do casamento':ph==='1 semana'?'Na semana anterior':ph+(ph.includes('meses')||ph==='1 mês'?' antes':''))} ${end?`<span class="when">até ${fmtD(end)}</span>`:''}${now?'<span class="chip acc">Agora</span>':''}<span class="cnt">${all.filter(t=>t.done).length}/${all.length}</span></button>`;
    if(!closed)body+=shown.map(t=>taskRow(t)).join('');
  });
  return vh('Tarefas',`${done} de ${T.length} concluídas${late?` · ${late} ${plural(late,'atrasada','atrasadas')}`:''}. As datas são calculadas a partir do dia do casamento.`,addBtn('tasks','Nova tarefa'))+
  `<div class="toolbar"><div class="seg" role="group">${[['todas','Todas'],['fazer','A fazer'],['atrasadas','Atrasadas'],['feitas','Concluídas']].map(([k,l])=>`<button class="${F.tf===k?'on':''}" data-act="setf" data-k="tf" data-v="${k}">${l}</button>`).join('')}</div>
   <select class="field" id="ftr" data-act-change="setf" data-k="tr" aria-label="Filtrar por responsável"><option value="">Todos os responsáveis</option>${people().map(p=>`<option ${F.tr===p?'selected':''}>${e(p)}</option>`).join('')}</select></div>
   <div class="list">${body||'<div class="empty">Nenhuma tarefa nesse filtro.</div>'}</div>`;
}

function vOrcamento(){
  const B=budgetCalc(),R=rows('budget'),today=todayISO();
  const over=B.livre<0;
  const sum=`<div class="sum"><div><small>Orçamento total</small><b>${money(B.total)}</b></div><div><small>Contratado</small><b>${money(B.contr)}</b></div><div><small>Já pago</small><b style="color:var(--ok)">${money(B.pago)}</b></div><div><small>Falta pagar</small><b style="color:var(--warn)">${money(B.falta)}</b></div><div><small>${over?'Acima do orçamento':'Livre para gastar'}</small><b style="color:${over?'var(--bad)':'inherit'}">${money(Math.abs(B.livre))}</b></div></div>
  <div class="card" style="margin-bottom:14px">${bar([[pct(B.pago,B.total),'c-ok'],[pct(B.falta,B.total),'c-warn'],[pct(B.est,B.total),'c-acc']])}
  <div class="legend"><span><i class="dot c-ok"></i>Pago</span><span><i class="dot c-warn"></i>Contratado, falta pagar</span><span><i class="dot c-acc"></i>Previsto, ainda sem contrato <b class="num">${money(B.est)}</b></span><span><i class="dot c-mut"></i>Livre</span></div></div>`;
  const list=R.map(r=>{const p=num(r.previsto),c=num(r.contratado),g=num(r.pago),f=Math.max(0,c-g);
   return`<div class="item" data-act="edit" data-m="budget" data-id="${r.id}"><div class="brow" style="flex:1;min-width:0">
    <div class="lbl"><div class="t">${e(r.categoria)}</div><div class="muted small">${e([r.fornecedor,r.descricao].filter(Boolean).join(' · '))||'&nbsp;'}</div></div>
    <div><small class="muted small">Previsto</small><div class="n">${p?money(p):'—'}</div></div>
    <div><small class="muted small">Contratado</small><div class="n">${c?money(c):'—'}</div></div>
    <div><small class="muted small">Pago</small><div class="n" style="color:${g?'var(--ok)':'inherit'}">${g?money(g):'—'}</div></div>
    <div><small class="muted small">Falta</small><div class="n" style="color:${f?'var(--warn)':'inherit'}">${c?money(f):'—'}</div></div>
    ${c>0?`<div class="full">${bar([[pct(g,c),'c-ok']]).replace('class="bar"','class="bar thin"')}</div>`:''}
    ${r.vencimento&&f>0?`<div class="full"><span class="chip ${r.vencimento<today?'bad':'warn'}">Vence ${fmtD(r.vencimento)}${r.forma?' · '+e(r.forma):''}</span></div>`:''}
   </div></div>`}).join('');
  return vh('Orçamento','Previsto é a estimativa; contratado é o que foi fechado; pago é o que já saiu do bolso.',addBtn('budget','Novo item'))+sum+`<div class="list">${list||'<div class="empty">Nenhum item ainda.</div>'}</div>`;
}

  <div class="ap"><span class="small muted">Aplicar a todos:</span><select class="field" id="ap_q" aria-label="Quem paga">${['',...ppl].map(p=>`<option value="${e(p)}">${p||'Quem paga?'}</option>`).join('')}</select><input class="field" id="ap_f" list="dl_fonte" placeholder="Origem (ex: Salário)"><button type="button" class="btn ghost" data-act="applyAll">Aplicar</button></div>
  <div class="grp" style="padding:12px 0 6px">Pagamentos do mês</div><div id="mpays">${its.map(prow).join('')||'<div class="muted small">Nenhum pagamento previsto.</div>'}</div>
  <div class="grp" style="padding:16px 0 2px">Quanto entra neste mês (opcional)</div><p class="muted small" style="margin:0 0 6px">Informe as receitas para ver o saldo do mês.</p><div id="minc">${(incFor(m).length?incFor(m):[{fonte:'Salário',recorrente:true}]).map(r=>incRow(r,ppl,m)).join('')}</div>
  <button type="button" class="btn ghost" data-act="addInc" style="margin-top:6px">${ico('plus')}Adicionar receita</button>
  <datalist id="dl_fonte"><option value="Salário"><option value="Comissão"><option value="13º salário"><option value="Renda extra"><option value="Economias"><option value="Outros"></datalist>
  <div class="pv" id="msum"></div>
  <div class="fa"><button type="button" class="btn ghost" data-act="closeModal">Cancelar</button><button type="button" class="btn" data-act="saveMonth">Salvar mês</button></div></div></div>`;

function incRow(r,ppl,m){
  const from=r.recorrente&&r.mes&&r.mes<m?` · vem de ${mLbl(r.mes)}`:'';
  return`<div class="irow" ${r.id?`data-iid="${r.id}"`:''}><input class="field if" list="dl_fonte" value="${e(r.fonte||'Salário')}" placeholder="Fonte" aria-label="Fonte"><select class="field iq" aria-label="De quem">${['',...ppl].map(p=>`<option value="${e(p)}" ${p===(r.quem||'')?'selected':''}>${p||'Quem?'}</option>`).join('')}</select><input class="field iv num" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Valor" value="${r.valor==null?'':r.valor}" aria-label="Valor"><label class="cb2"><input class="ir" type="checkbox" ${r.recorrente?'checked':''}> Todo mês${from}</label><button type="button" class="btn ghost" data-act="delInc" aria-label="Remover receita">${ico('x')}</button></div>`;
}
function monthSum(){
  let pay=0,inc=0;const byF={},byQ={};
  document.querySelectorAll('#mpays .mrow').forEach(row=>{
    const i=row.querySelector('.mp'),v=i.value!==''?+i.value||0:+i.dataset.auto||0;pay+=v;
    if(v>0){const f=row.querySelector('.mf').value.trim()||'Sem origem',q=row.querySelector('.mq').value||'Sem definir';byF[f]=(byF[f]||0)+v;byQ[q]=(byQ[q]||0)+v}
  });
  const lst=o=>Object.entries(o).map(([k,v])=>`${e(k)} <b class="num">${money(v)}</b>`).join(' · ');
  const brk=pay>0?`<div class="small muted" style="margin-bottom:8px">Por origem: ${lst(byF)}<br>Por pessoa: ${lst(byQ)}</div>`:'';
  document.querySelectorAll('#minc .iv').forEach(i=>{inc+=+i.value||0});
  const s=inc-pay;
  $('#msum').innerHTML=brk+`Pagamentos <b class="num">${money(pay)}</b> · Receitas <b class="num">${money(inc)}</b> · Saldo <b class="num" style="color:var(${s<0?'--bad':'--ok'})">${s<0?'-':''}${money(Math.abs(s))}</b>`+(inc===0?`<div class="muted small" style="margin-top:6px">Informe acima quanto entra neste mês (salário, comissão…) para o saldo ficar positivo.</div>`:'');
}
async function saveMonth(){
  const m=S.mm.m,jobs=[];
  document.querySelectorAll('#mpays .mrow').forEach(row=>{
    const id=row.dataset.id,it=find('budget',id);if(!it)return;const v=row.querySelector('input').value.trim(),parc={...(it.parc||{})};
    if(v==='')delete parc[m];else parc[m]=+v;
    const q=row.querySelector('.mq').value,f=row.querySelector('.mf').value.trim(),orig={...(it.orig||{})};
    if(q||f)orig[m]={quem:q,fonte:f};else delete orig[m];
    if(JSON.stringify(parc)!==JSON.stringify(it.parc||{})||JSON.stringify(orig)!==JSON.stringify(it.orig||{}))jobs.push(put('budget',id,{...cleanRow(it),parc,orig}));
  });
  let ord=nextOrd('income');
  document.querySelectorAll('#minc .irow').forEach(row=>{
    const iid=row.dataset.iid,old=iid?find('income',iid):null,valor=row.querySelector('.iv').value.trim();
    const d={fonte:row.querySelector('.if').value.trim()||'Outros',quem:row.querySelector('.iq').value,valor:valor===''?0:+valor,recorrente:row.querySelector('.ir').checked};
    if(old){if(d.fonte!==old.fonte||d.quem!==(old.quem||'')||d.valor!==num(old.valor)||d.recorrente!==!!old.recorrente)jobs.push(put('income',iid,{...cleanRow(old),...d}))}
    else if(d.valor>0)jobs.push(put('income',uid(),{...d,mes:m,ord:ord++}));
  });
  S.mm.del.forEach(id=>jobs.push(del('income',id)));
  closeModal();
  await Promise.all(jobs);
  toast('Mês '+mLbl(m)+' salvo');
}
function projection(){
  const cur=todayISO().slice(0,7),w=S.cfg.dataCasamento||'',wm=w?w.slice(0,7):mAdd(cur,12);
  const items=[];
  rows('budget').forEach(r=>{
    const val=num(r.contratado)>0?num(r.contratado):num(r.previsto);if(val<=0)return;
    const rem=Math.max(0,val-num(r.pago));
    let ini=r.inicio||mAdd(cur,1),fim=r.fim||mAdd(wm,-1);
    if(S.drag&&S.drag.id===r.id){ini=S.drag.ini;fim=S.drag.fim}
    if(ini<cur)ini=cur;if(fim<ini)fim=ini;
    const fixed={};Object.entries(r.parc||{}).forEach(([m,v])=>{if(m>=cur&&v!=null&&v!=='')fixed[m]=num(v)});
    items.push({r,val,rem,ini,fim,pay:{},fixed});
  });
  let last=wm>cur?wm:cur;items.forEach(i=>{if(i.fim>last)last=i.fim;Object.keys(i.fixed).forEach(m=>{if(m>last)last=m})});
  const months=[];for(let m=cur;m<=last;m=mAdd(m,1))months.push(m);
  items.forEach(i=>{if(i.rem>0){

/* ---------- convidados em massa ---------- */
function parseGuests(txt,defLado,defGrupo){
  const out=[];
  txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach((ln,i)=>{
    const strict=/[\t;]/.test(ln);
    const parts=ln.split(strict?/[\t;]/:/,/).map(s=>s.trim()).filter(Boolean);
    if(!parts.length)return;
    let nome=parts.shift();const g={lado:defLado||'Noiva',grupo:defGrupo||'',pessoas:1,telefone:''};const rest=[];
    parts.forEach(p=>{
      if(/^(noiva|noivo|ambos)$/i.test(p))g.lado=p[0].toUpperCase()+p.slice(1).toLowerCase();
      else if(/^\d{1,2}$/.test(p))g.pessoas=+p;
      else if(/^[\d\s()+.-]{8,}$/.test(p))g.telefone=p;
      else rest.push(p);
    });
    if(rest.length){if(strict)g.grupo=rest[0];else nome+=', '+rest.join(', ')}
    if(i===0&&/^nome$/i.test(nome))return;
    let m;
    if(m=nome.match(/\s*(?:x|×)\s*(\d+)\s*$/i)){g.pessoas=+m[1];nome=nome.slice(0,m.index)}
    else if(m=nome.match(/\s*\+\s*(\d+)\s*$/)){g.pessoas=1+ +m[1];nome=nome.slice(0,m.index)}
    nome=nome.replace(/^[-•*\d.)\s]+(?=[A-Za-zÀ-ú])/,'').trim();
    if(nome)out.push({nome,...g});
  });
  return out;
}

  <label class="full">Ou escolha um arquivo .csv ou .txt<input class="field" type="file" id="bkf" accept=".csv,.txt,text/csv,text/plain"></label></div>
  <div class="pv" id="bkp">Cole a lista acima para ver a prévia.</div>
  <div class="fa"><button type="button" class="btn ghost" data-act="closeModal">Cancelar</button><button type="button" class="btn" id="bkgo" data-act="bulkGo" disabled>Adicionar</button></div></div></div>`;
  $('#bk').focus();
}
function bulkList(){
  const have=new Set(rows('guests').map(g=>(g.nome||'').toLowerCase())),seen=new Set(),ok=[];let dup=0;
  parseGuests($('#bk').value,$('#bk_lado').value,$('#bk_grupo').value.trim()).forEach(g=>{const k=g.nome.toLowerCase();if(have.has(k)||seen.has(k))dup++;else{seen.add(k);ok.push(g)}});
  return{ok,dup};
}
function bulkPreview(){
  const{ok,dup}=bulkList(),p=ok.reduce((a,g)=>a+g.pessoas,0);
  $('#bkp').innerHTML=ok.length?`<b>${ok.length} ${plural(ok.length,'convidado','convidados')}</b> (${p} ${plural(p,'pessoa','pessoas')})${dup?` · ${dup} já ${plural(dup,'existe','existem')} e ${plural(dup,'será ignorado','serão ignorados')}`:''}<br><span class="muted">${ok.slice(0,5).map(g=>e(g.nome)+(g.pessoas>1?' ×'+g.pessoas:'')).join(', ')}${ok.length>5?'…':''}</span>`:(dup?`${dup} já ${plural(dup,'existe','existem')} na lista.`:'Cole a lista acima para ver a prévia.');
  const b=$('#bkgo');b.disabled=!ok.length;b.textContent=ok.length?`Adicionar ${ok.length}`:'Adicionar';
}
async function bulkGo(){
  const{ok}=bulkList();if(!ok.length)return;
  closeModal();
  const base=nextOrd('guests'),before=guestCalc().total;let i=0,done=0,fail=false;
  toast('Adicionando '+ok.length+' convidados…',1);
  const worker=async()=>{while(i<ok.length&&!fail){const k=i++,g=ok[k];
    let good=false;for(let a=0;a<4&&!good;a++){try{await DB.collection('guests').doc(uid()).set({...g,convite:false,rsvp:'Pendente',noivado:false,cha:false,mesa:'',obs:'',ord:base+k});good=true}catch(err){if(err&&err.code==='invalid_argument'){fail=true;toast('Sem permissão para editar. Peça acesso de editor no menu Compartilhar.');return}await new Promise(r=>setTimeout(r,400*(a+1)))}}
    if(!good){fail=true;return}done++}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  if(done){bigBurst();const t=guestCalc().total;toast(done+' '+plural(done,'convidado adicionado','convidados adicionados')+' · '+t+' '+plural(t,'pessoa','pessoas')+' na lista',1)}
  if(fail&&done<ok.length)setTimeout(()=>toast('Foram adicionados '+done+' de '+ok.length+'. Tente colar o restante de novo.'),2500);
}
function readFileText(file){
  const fr=new FileReader();
  fr.onload=()=>{let t=String(fr.result);
    if(t.includes('�')){const f2=new FileReader();f2.onload=()=>{$('#bk').value=String(f2.result);bulkPreview()};f2.readAsText(file,'windows-1252');return}
    $('#bk').value=t;bulkPreview()};
  fr.readAsText(file,'utf-8');
}

/* ---------- eventos ---------- */
/* arrastar barras do Gantt */
document.addEventListener('pointerdown',ev=>{
  const gb=ev.target.closest&&ev.target.closest('.gb');if(!gb||ev.button>0)return;
  const gt=gb.closest('.gantt'),th=gt.querySelector('th.mh');if(!th)return;
  ev.preventDefault();
  const mode=ev.target.dataset&&ev.target.dataset.h||'move',x0=ev.clientX,cw=th.getBoundingClientRect().width||70;
  const id=gb.dataset.id,ini0=gb.dataset.ini,fim0=gb.dataset.fim,first=gt.dataset.first,last=gt.dataset.last;
  let moved=false;
  const calc=dx=>{let d=Math.round(dx/cw),ini=ini0,fim=fim0;
    if(mode==='move'){d=Math.max(mDiff(ini0,first),Math.min(mDiff(fim0,last),d));ini=mAdd(ini0,d);fim=mAdd(fim0,d)}
    else if(mode==='l'){ini=mAdd(ini0,d);if(ini>fim0)ini=fim0;if(ini<first)ini=first}
    else{fim=mAdd(fim0,d);if(fim<ini0)fim=ini0;if(fim>last)fim=last}
    return{ini,fim}};
  const mv=e2=>{const dx=e2.clientX-x0;if(Math.abs(dx)>4)moved=true;if(!moved)return;
    const r=calc(dx);if(!S.drag||S.drag.ini!==r.ini||S.drag.fim!==r.fim){S.drag={id,...r};render()}};
  const up=async()=>{
    document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    if(moved){S.noClick=true;setTimeout(()=>{S.noClick=false},300);
      const d=S.drag;if(d&&(d.ini!==ini0||d.fim!==fim0)){await patch('budget',id,{inicio:d.ini,fim:d.fim});toast('Pagamento de '+mLbl(d.ini)+' a '+mLbl(d.fim))}}
    if(moved||S.drag){S.drag=null;render()}
  };
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
});
document.addEventListener('click',ev=>{
  if(S.noClick){ev.stopPropagation();return}
  if(ev.target.closest('a[data-stop]'))return;
  const mo=ev.target.closest('.gantt [data-mo]');
  if(mo){openMonth(mo.dataset.mo);return}
  const gc=ev.target.closest('.gantt td.gbar,.gantt td.gap');
  if(gc){const th=[...gc.closest('table').querySelectorAll('th.mh')].find(t=>{const r=t.getBoundingClientRect();return ev.clientX>=r.left&&ev.clientX<r.right});if(th){openMonth(th.dataset.mo);return}}
  const a=ev.target.closest('[data-act]');
  if(!a)return;
  const f=ACT[a.dataset.act];if(!f)return;
  if(a.tagName==='A')ev.preventDefault();
  ev.stopPropagation();f(a,ev);
});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='bkf'&&t.files&&t.files[0]){readFileText(t.files[0]);return}
  if(t.id==='bk_lado'||t.id==='bk_grupo'){bulkPreview();return}
  const a=t.closest('[data-act-change]');if(a){ACT[a.dataset.actChange](a,ev)}});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='bk'||t.id==='bk_grupo'){bulkPreview();return}
  if(t.closest&&t.closest('#mpays,#minc')){monthSum();return}
  if(t.dataset&&t.dataset.input==='gq'){S.f.gq=t.value;rerender()}
  else if(t.dataset&&t.dataset.input==='qa')S.f.qa=t.value});
document.addEventListener('submit',ev=>{if(ev.target.id==='mform'){ev.preventDefault();submitForm()}else if(ev.target.id==='qaform'){ev.preventDefault();quickAdd()}else if(ev.target.id==='payform'){ev.preventDefault();savePay()}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Escape')return;if($('#modal').innerHTML)closeModal();else if(S.gfull)ACT.gfull()});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(TITLE[v]&&v!==S.view){S.view=v;rerender()}});

/* ---------- inicialização ---------- */
async function boot(){
  const h=location.hash.slice(1);if(TITLE[h])S.view=h;
  render();
  let db=null;try{db=await window.claude.use('db')}catch(_){}
  if(!db){S.dbNull=true;render();return}
  DB=db;
  const sub=(col,fn)=>db.collection(col).onSnapshot(snap=>{fn(snap);S.loaded[col]=true;rerender()},err=>{if(err&&err.code==='revoked'){S.dbNull=true;rerender()}});
  sub('meta',snap=>{const d=snap.docs.find(x=>x.id==='config');S.cfg=d?d.data():null});
  COLS.forEach(c=>sub(c,snap=>{S.rows[c]=snap.docs.map(d=>({id:d.id,...d.data()}))}));
}
boot();
})();
</script>
